name: Update India Inflation Tracker

on:
  schedule:
    # Check daily during the normal MoSPI CPI release window.
    - cron: "30 11 12-18 * *"   # 17:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Render and validate even if no newer CPI month is detected"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: inflation-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether MoSPI has newer CPI data
        id: check
        shell: bash
        env:
          FORCE_UPDATE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail

          # MoSPI's API currently requires legacy TLS renegotiation.
          # Enable it only for the curl calls made in this step.
          cat > /tmp/openssl-mospi.cnf <<'EOF'
          openssl_conf = openssl_init

          [openssl_init]
          ssl_conf = ssl_sect

          [ssl_sect]
          system_default = system_default_sect

          [system_default_sect]
          Options = UnsafeLegacyServerConnect
          EOF

          export OPENSSL_CONF=/tmp/openssl-mospi.cnf

          CURRENT_YEAR=$(date -u +%Y)
          PREVIOUS_YEAR=$((CURRENT_YEAR - 1))

          BASE_URL="https://api.mospi.gov.in"

          CURRENT_URL="${BASE_URL}/api/cpi/getCPIData?base=2024&year=${CURRENT_YEAR}"
          PREVIOUS_URL="${BASE_URL}/api/cpi/getCPIData?base=2024&year=${PREVIOUS_YEAR}"

          echo "Checking MoSPI CPI API..."
          echo "Current year: ${CURRENT_YEAR}"
          echo "Previous year: ${PREVIOUS_YEAR}"

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            "${CURRENT_URL}" \
            -o /tmp/cpi_current.json

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            "${PREVIOUS_URL}" \
            -o /tmp/cpi_previous.json

          PUBLISHED_MONTH=$(jq -r '.latest_month // empty' software/tracker_status.json)

          echo "Published tracker month: ${PUBLISHED_MONTH}"

          LATEST_MONTH=$(
            jq -r '
              [
                (.data // . // [])[]
                | .month?
                | select(. != null and . != "")
              ]
              | max
            ' /tmp/cpi_current.json
          )

          echo "Latest MoSPI month: ${LATEST_MONTH}"

          if [ "${FORCE_UPDATE}" = "true" ]; then
            echo "Force update requested."
            echo "update=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${LATEST_MONTH}" ] && [ "${LATEST_MONTH}" != "${PUBLISHED_MONTH}" ]; then
            echo "New CPI data detected."
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tracker is already current."
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi
    
      - name: Set up R
        if: steps.check.outputs.stale == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries for sf
        if: steps.check.outputs.stale == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libgdal-dev             libgeos-dev             libproj-dev             libudunits2-dev

      - name: Install R packages
        if: steps.check.outputs.stale == 'true'
        run: |
          Rscript -e "install.packages(c(
            'dplyr','tidyr','ggplot2','lubridate','httr2','jsonlite',
            'stringr','forcats','scales','knitr','ragg','sf','ggiraph'
          ), repos='https://cloud.r-project.org')"

      - name: Set up Quarto
        if: steps.check.outputs.stale == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render inflation tracker
        if: steps.check.outputs.stale == 'true'
        run: |
          rm -rf software/data_cache
          mkdir -p software/data_cache
          quarto render software/inflation-tracker.qmd

      - name: Validate rendered tracker
        if: steps.check.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f software/inflation-tracker.html
          test -f software/tracker_status.json

          PUBLISHED=$(jq -r '.latest_month' software/tracker_status.json)
          EXPECTED="${{ steps.check.outputs.latest }}"

          echo "Expected month: $EXPECTED"
          echo "Rendered month: $PUBLISHED"

          if [[ "$PUBLISHED" != "$EXPECTED" ]]; then
            echo "ERROR: rendered tracker did not reach the newly released CPI month."
            exit 1
          fi

      - name: Commit tracker output only
        if: steps.check.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             software/inflation-tracker.html             software/inflation-tracker_files             software/tracker_status.json

          if git diff --cached --quiet; then
            echo "No tracker output changes to commit."
            exit 0
          fi

          git commit -m "Inflation tracker: ${{ steps.check.outputs.latest }} data"
          git push origin main

      - name: Trigger website publish
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
