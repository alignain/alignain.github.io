name: Update India Inflation Tracker

on:
  schedule:
    # Check daily during the normal MoSPI CPI release window.
    - cron: "30 11 12-18 * *"   # 17:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Render and validate even if no newer CPI month is detected"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: inflation-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether MoSPI has newer CPI data
        id: check
        shell: bash
        run: |
          set -euo pipefail

          STATUS_FILE="software/tracker_status.json"
          PUBLISHED=$(jq -r '.latest_month' "$STATUS_FILE")
          echo "Published tracker month: $PUBLISHED"

          YEAR=$(date -u +%Y)
          PREV=$((YEAR - 1))
          LATEST=""

          for Y in "$YEAR" "$PREV"; do
            RESP=$(curl -sS --max-time 60 --retry 3 --retry-delay 5 -G               "https://api.mospi.gov.in/api/cpi/getCPIData"               --data-urlencode "base_year=2024"               --data-urlencode "series=Current"               --data-urlencode "state_code=1"               --data-urlencode "sector_code=3"               --data-urlencode "division_code=0"               --data-urlencode "year=$Y"               --data-urlencode "Format=JSON"               --data-urlencode "limit=100"               --data-urlencode "page=1")

            FOUND=$(echo "$RESP" | jq -r '
              (.data // [])
              | map(select(.inflation != null and .inflation != ""))
              | map((.year|tostring) + "-" + (
                  {January:"01",February:"02",March:"03",April:"04",
                   May:"05",June:"06",July:"07",August:"08",
                   September:"09",October:"10",November:"11",December:"12"}[.month] // "00"))
              | map(select(endswith("-00") | not))
              | sort | last // empty')

            if [ -n "$FOUND" ]; then
              LATEST="$FOUND"
              break
            fi
          done

          if [ -z "$LATEST" ]; then
            echo "Could not determine MoSPI's latest CPI month."
            exit 1
          fi

          echo "MoSPI latest month: $LATEST"

          FORCE="${{ inputs.force || false }}"

          if [[ "$LATEST" > "$PUBLISHED" || "$FORCE" == "true" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Tracker is already current."
          fi

      - name: Set up R
        if: steps.check.outputs.stale == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries for sf
        if: steps.check.outputs.stale == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libgdal-dev             libgeos-dev             libproj-dev             libudunits2-dev

      - name: Install R packages
        if: steps.check.outputs.stale == 'true'
        run: |
          Rscript -e "install.packages(c(
            'dplyr','tidyr','ggplot2','lubridate','httr2','jsonlite',
            'stringr','forcats','scales','knitr','ragg','sf','ggiraph'
          ), repos='https://cloud.r-project.org')"

      - name: Set up Quarto
        if: steps.check.outputs.stale == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render inflation tracker
        if: steps.check.outputs.stale == 'true'
        run: |
          rm -rf software/data_cache
          mkdir -p software/data_cache
          quarto render software/inflation-tracker.qmd

      - name: Validate rendered tracker
        if: steps.check.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f software/inflation-tracker.html
          test -f software/tracker_status.json

          PUBLISHED=$(jq -r '.latest_month' software/tracker_status.json)
          EXPECTED="${{ steps.check.outputs.latest }}"

          echo "Expected month: $EXPECTED"
          echo "Rendered month: $PUBLISHED"

          if [[ "$PUBLISHED" != "$EXPECTED" ]]; then
            echo "ERROR: rendered tracker did not reach the newly released CPI month."
            exit 1
          fi

      - name: Commit tracker output only
        if: steps.check.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             software/inflation-tracker.html             software/inflation-tracker_files             software/tracker_status.json

          if git diff --cached --quiet; then
            echo "No tracker output changes to commit."
            exit 0
          fi

          git commit -m "Inflation tracker: ${{ steps.check.outputs.latest }} data"
          git push origin main

      - name: Trigger website publish
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
