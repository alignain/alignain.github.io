name: Update India Inflation Tracker

on:
  schedule:
    - cron: "30 11 12-18 * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Force update even if no new CPI data is detected"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: inflation-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether MoSPI has newer CPI data
        id: check
        shell: bash
        env:
          FORCE_UPDATE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          cat > /tmp/openssl-mospi.cnf <<'EOF'
          openssl_conf = openssl_init

          [openssl_init]
          ssl_conf = ssl_sect

          [ssl_sect]
          system_default = system_default_sect

          [system_default_sect]
          Options = UnsafeLegacyServerConnect
          EOF

          export OPENSSL_CONF=/tmp/openssl-mospi.cnf

          CURRENT_YEAR=$(date -u +%Y)

          BASE_URL="https://api.mospi.gov.in"

          CURRENT_URL="${BASE_URL}/api/cpi/getCPIData?base_year=2024&series=Current&state_code=1&sector_code=3&year=${CURRENT_YEAR}&Format=JSON&limit=100&page=1"

          echo "Checking MoSPI CPI API..."
          echo "Current year: ${CURRENT_YEAR}"

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            "${CURRENT_URL}" \
            -o /tmp/cpi_current.json

          if ! jq empty /tmp/cpi_current.json >/dev/null 2>&1; then
            echo "ERROR: MoSPI response is not valid JSON."
            exit 1
          fi

          PUBLISHED_MONTH=$(jq -r '.latest_month // empty' software/tracker_status.json)

          echo "Published tracker month: ${PUBLISHED_MONTH}"

          LATEST_MONTH=$(
            jq -r '
              [
                (.data // [])[]
                | .month?
                | select(. != null and . != "")
              ]
              | max // empty
            ' /tmp/cpi_current.json
          )

          echo "Latest MoSPI month: ${LATEST_MONTH}"

          if [ "${FORCE_UPDATE}" = "true" ]; then
            echo "Force update requested."
            echo "update=true" >> "$GITHUB_OUTPUT"

          elif [ -n "${LATEST_MONTH}" ] && [ "${LATEST_MONTH}" != "${PUBLISHED_MONTH}" ]; then
            echo "New CPI data detected."
            echo "update=true" >> "$GITHUB_OUTPUT"

          else
            echo "Tracker is already current."
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up R
        if: steps.check.outputs.update == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries for sf
        if: steps.check.outputs.update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev

        - name: Install R packages
          if: steps.check.outputs.update == 'true'
          shell: bash
          run: |
            set -euo pipefail

            Rscript -e '
              options(repos = c(CRAN = "https://cloud.r-project.org"))

              packages <- c(
                "dplyr",
                "tidyr",
                "ggplot2",
                "lubridate",
                "httr2",
                "jsonlite",
                "stringr",
                "forcats",
                "scales",
                "knitr",
                "rmarkdown",
                "ragg",
                "sf",
                "ggiraph"
              )

              install.packages(
                packages,
                dependencies = c("Depends", "Imports", "LinkingTo")
              )

              for (pkg in packages) {
                if (!requireNamespace(pkg, quietly = TRUE)) {
                  stop("Package not installed: ", pkg)
                }
              }

              message(
                "rmarkdown version: ",
                as.character(packageVersion("rmarkdown"))
              )

              message("All required R packages are installed.")
            '    

      - name: Set up Quarto
        if: steps.check.outputs.update == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Prepare clean tracker cache
        if: steps.check.outputs.update == 'true'
        run: |
          rm -rf software/data_cache
          mkdir -p software/data_cache

      - name: Render inflation tracker
        if: steps.check.outputs.update == 'true'
        run: |
          quarto render software/inflation-tracker.qmd

      - name: Validate rendered tracker
        if: steps.check.outputs.update == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f software/inflation-tracker.html
          test -f software/tracker_status.json

          echo "Tracker status:"
          cat software/tracker_status.json

          RENDERED_MONTH=$(jq -r '.latest_month // empty' software/tracker_status.json)

          if [ -z "${RENDERED_MONTH}" ]; then
            echo "ERROR: latest_month is missing."
            exit 1
          fi

          echo "Rendered tracker month: ${RENDERED_MONTH}"

      - name: Commit tracker output only
        if: steps.check.outputs.update == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git reset -- software/data_cache 2>/dev/null || true

          git add \
            software/inflation-tracker.html \
            software/inflation-tracker_files \
            software/tracker_status.json

          echo "Files staged:"
          git status --short

          if git diff --cached --name-only | grep -E '\.rds$'; then
            echo "ERROR: RDS cache file is staged."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update India inflation tracker"
          git push origin main

      - name: Trigger website publish
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --ref main

      - name: Report no update required
        if: steps.check.outputs.update != 'true'
        run: |
          echo "No new CPI data detected."
          echo "Inflation tracker remains unchanged."
